<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anass Bounhar</title>
  <meta name="description" content="Infrastructure, automation, and desktop tools." />
  <style>
    :root {
      --deep-blue: #004161;
      --lab-blue: #0071a2;
      --bright-blue: #00a8e3;
      --dark-grey: #5a5a5a;
      --medium-grey: #8a8a8a;
      --bg: #f4f7f9;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(0, 168, 227, 0.08), transparent),
                  radial-gradient(900px 500px at 80% 100%, rgba(0, 113, 162, 0.06), transparent),
                  var(--bg);
      color: var(--deep-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 32rem;
      text-align: center;
    }
    .mark {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1.5rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, var(--lab-blue), var(--bright-blue));
      box-shadow: 0 8px 24px rgba(0, 65, 97, 0.12);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 2rem;
      color: var(--dark-grey);
      line-height: 1.6;
      font-size: 1.05rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      background: var(--lab-blue);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(0, 113, 162, 0.25);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    a.btn:hover {
      background: var(--deep-blue);
      transform: translateY(-1px);
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--medium-grey);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Anass Bounhar</h1>
    <p>Infrastructure, automation, timesheets, and cross-platform tools for operations teams.</p>
    <a class="btn" href="https://anassbounhar.github.io/public/">View projects</a>
    <footer>Calm tools for busy systems.</footer>
  </main>
</body>
</html>
